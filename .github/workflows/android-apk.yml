name: Build HSC English APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hsc-english-2nd-paper-apk-build.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q hsc-english-2nd-paper-apk-build.zip -d project
          test -f project/hsc-english-2nd-paper/settings.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        working-directory: project/hsc-english-2nd-paper
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSC-English-2nd-Paper-APK
          path: project/hsc-english-2nd-paper/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
