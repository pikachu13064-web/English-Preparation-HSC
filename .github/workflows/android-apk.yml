name: Build HSC English APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hsc-english-2nd-paper-apk-build.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q hsc-english-2nd-paper-apk-build.zip -d project
          test -f project/hsc-english-2nd-paper/settings.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        working-directory: project/hsc-english-2nd-paper
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp project/hsc-english-2nd-paper/app/build/outputs/apk/debug/*.apk release/HSCenglish.apk

      - name: Upload APK as temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSC-English-2nd-Paper-APK
          path: release/HSCenglish.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as a permanent GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: HSC English 2nd Paper APK
          body: |
            Latest installable debug APK for HSC English 2nd Paper.
            Download HSCenglish.apk below and install it on your Android device.
          files: release/HSCenglish.apk
          overwrite_files: true
          make_latest: true

      - name: Remove old app-debug.apk release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset apk-latest app-debug.apk --yes || true
